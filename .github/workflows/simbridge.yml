name: Build SimConnect bridge (Windows)

on:
  push:
    branches: [main]
    paths: ['bridge/**', '.github/workflows/simbridge.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r bridge/requirements.txt pyinstaller

      - name: Smoke test (demo mode)
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'bridge/simbridge.py','--demo' -PassThru
          Start-Sleep -Seconds 4
          $r = Invoke-RestMethod http://127.0.0.1:47800/position
          Stop-Process -Id $p.Id
          if (-not $r.connected) { throw 'bridge did not report a position' }
          "OK: $($r.position | ConvertTo-Json -Compress)"

      - name: Build simbridge.exe
        run: pyinstaller --onefile --console --name simbridge --collect-all SimConnect bridge/simbridge.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: simbridge
          name: SimConnect bridge (simbridge.exe)
          make_latest: true
          body: |
            Windows helper that feeds your MSFS 2020/2024 position to the converter's Mission+ Auto ATA.

            1. Download **simbridge.exe** below and run it (before or after starting the sim).
            2. On the Mission+ Nav Log, set Auto ATA to **SimConnect** and tap **ON**.

            It only serves your position to this computer (http://127.0.0.1:47800). Windows may show a
            SmartScreen warning because the file isn't code-signed: More info → Run anyway.
            Built automatically from `bridge/simbridge.py` (commit ${{ github.sha }}).
          files: dist/simbridge.exe
